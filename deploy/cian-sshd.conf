# Install on the proxy VPS as /etc/ssh/sshd_config.d/60-home-hunter-cian.conf.
# Dedicated user and public key required. Never use a root key for the tunnel.
Match User cian-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen *:443 *:80
    PermitListen none
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /bin/false
Match all
