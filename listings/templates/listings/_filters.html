<form class="filters" method="get"><div class="filters-heading"><strong>Параметры поиска</strong><span>Измените условия — выдача обновится сразу после применения</span></div>
  <div><label>Источник</label><select name="source"><option value="">Все</option>{% for value, label in filter_options.sources %}<option value="{{ value }}" {% if filters.source == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div><label>Район</label><select name="district"><option value="">Все</option>{% for district in filter_options.districts %}<option value="{{ district }}" {% if filters.district == district %}selected{% endif %}>{{ district }}</option>{% endfor %}</select></div>
  <div><label>Комнаты</label><select name="rooms"><option value="">Все</option>{% for room in filter_options.rooms %}<option value="{{ room }}" {% if filters.rooms == room|stringformat:'s' %}selected{% endif %}>{{ room }}</option>{% endfor %}</select></div>
  <div><label>Цена, ₽</label><span class="range"><input name="price_min" inputmode="numeric" value="{{ filters.price_min }}" placeholder="от"><input name="price_max" inputmode="numeric" value="{{ filters.price_max }}" placeholder="до"></span></div>
  <div><label>Цена за м², ₽</label><span class="range"><input name="sqm_price_min" inputmode="numeric" value="{{ filters.sqm_price_min }}" placeholder="от"><input name="sqm_price_max" inputmode="numeric" value="{{ filters.sqm_price_max }}" placeholder="до"></span></div>
  <div><label>Площадь, м²</label><span class="range"><input name="area_min" inputmode="decimal" value="{{ filters.area_min }}" placeholder="от"><input name="area_max" inputmode="decimal" value="{{ filters.area_max }}" placeholder="до"></span></div>
  <div><label>Этаж</label><span class="range"><input name="floor_min" inputmode="numeric" value="{{ filters.floor_min }}" placeholder="от"><input name="floor_max" inputmode="numeric" value="{{ filters.floor_max }}" placeholder="до"></span></div>
  <div><label>Добавлено</label><select name="days"><option value="">За всё время</option><option value="1" {% if filters.days == '1' %}selected{% endif %}>За сутки</option><option value="7" {% if filters.days == '7' %}selected{% endif %}>За 7 дней</option><option value="30" {% if filters.days == '30' %}selected{% endif %}>За 30 дней</option><option value="90" {% if filters.days == '90' %}selected{% endif %}>За 90 дней</option></select></div>
  <input type="hidden" name="active" value="{{ filters.active }}"><div class="filter-actions"><button>Показать</button><a href="{{ request.path }}">Сбросить</a></div>
</form>
